name: CI

# Keeps main releasable: every push and PR to main must build.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, prod]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
